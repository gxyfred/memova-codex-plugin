interface:
  display_name: "Memova Vault Setup"
  short_description: "Create or connect a Memova raw-input root."
  default_prompt: "Setup your Memova knowledge base."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "memova"
      description: "Memova OAuth MCP server for knowledge-base setup sessions."
      transport: "streamable_http"
      url: "https://api.memova.ai/mcp"
