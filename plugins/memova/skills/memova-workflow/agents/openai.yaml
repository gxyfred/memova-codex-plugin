interface:
  display_name: "Memova Workflow"
  short_description: "Run the latest final note workflow."
  default_prompt: "Run latest final note workflow."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "memova"
      description: "Memova OAuth MCP server for notes, actions, and automation tasks."
      transport: "streamable_http"
      url: "https://api.memova.ai/mcp"
