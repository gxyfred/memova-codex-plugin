interface:
  display_name: "Memova Workflow"
  short_description: "Run existing Memova automation tasks."
  default_prompt: "Run latest note automation tasks."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "memova"
      description: "Memova OAuth MCP server for notes and automation tasks."
      transport: "streamable_http"
      url: "https://api.memova.ai/mcp"
