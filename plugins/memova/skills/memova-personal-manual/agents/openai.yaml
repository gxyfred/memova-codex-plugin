interface:
  display_name: "Memova Personal Manual"
  short_description: "Create and save your private Personal Manual."
  default_prompt: "Use $memova-personal-manual to generate my Personal Manual from an approved set of Codex tasks."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "memova"
      description: "Memova OAuth MCP server for Personal Manual status and atomic upload."
      transport: "streamable_http"
      url: "https://api.memova.ai/mcp"
